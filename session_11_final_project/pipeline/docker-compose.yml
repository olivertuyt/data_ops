name: shopvn-pipeline

x-airflow-common: &airflow-common
  image: shopvn-pipeline-runtime:${SHOPVN_CODE_VERSION}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION}
      ICEBERG_VERSION: ${ICEBERG_VERSION}
      POSTGRES_JDBC_VERSION: ${POSTGRES_JDBC_VERSION}
  env_file:
    - config/version.env
    - ${SHOPVN_ENV_FILE:-.env}
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@platform-db:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    PYTHONPATH: /opt/shopvn/spark/jobs
  networks: [pipeline-net, shopvn-source-net]
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./spark:/opt/shopvn/spark:ro
    - ./sql:/opt/shopvn/sql:ro
    - api-landing:/opt/airflow/landing/api
    - marketplace-landing:/opt/airflow/landing/marketplace
  depends_on:
    platform-db:
      condition: service_healthy
    polaris-setup:
      condition: service_completed_successfully
    landing-init:
      condition: service_completed_successfully

services:
  landing-init:
    image: alpine:3.22.1
    user: "0:0"
    command:
      - /bin/sh
      - -c
      - mkdir -p /landing/api /landing/marketplace && chown -R 50000:0 /landing/api /landing/marketplace && chmod -R u+rwX,g+rwX /landing/api /landing/marketplace
    volumes:
      - api-landing:/landing/api
      - marketplace-landing:/landing/marketplace
    restart: "no"

  platform-db:
    image: postgres:16.10-alpine
    env_file:
      - ${SHOPVN_ENV_FILE:-.env}
    environment:
      POSTGRES_USER: ${PLATFORM_DB_USER}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD}
      POSTGRES_DB: postgres
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      POLARIS_DB_NAME: ${POLARIS_DB_NAME}
    volumes:
      - platform-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [pipeline-net]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:${MINIO_VERSION}
    command: server /data --console-address ":9001"
    env_file:
      - ${SHOPVN_ENV_FILE:-.env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    networks: [pipeline-net]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 15

  setup-bucket:
    image: minio/mc:${MINIO_MC_VERSION}
    env_file:
      - ${SHOPVN_ENV_FILE:-.env}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set lake $$MINIO_ENDPOINT $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing lake/$$MINIO_BUCKET && mc ls lake
    networks: [pipeline-net]
    restart: "no"

  polaris-bootstrap:
    image: apache/polaris-admin-tool:${POLARIS_VERSION}
    env_file:
      - ${SHOPVN_ENV_FILE:-.env}
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://platform-db:5432/${POLARIS_DB_NAME}
      QUARKUS_DATASOURCE_USERNAME: ${PLATFORM_DB_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${PLATFORM_DB_PASSWORD}
    command:
      - bootstrap
      - -r
      - ${POLARIS_REALM}
      - -c
      - ${POLARIS_REALM},${POLARIS_CLIENT_ID},${POLARIS_CLIENT_SECRET}
    depends_on:
      platform-db:
        condition: service_healthy
    networks: [pipeline-net]
    restart: "no"

  polaris:
    image: apache/polaris:${POLARIS_VERSION}
    env_file:
      - ${SHOPVN_ENV_FILE:-.env}
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://platform-db:5432/${POLARIS_DB_NAME}
      QUARKUS_DATASOURCE_USERNAME: ${PLATFORM_DB_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${PLATFORM_DB_PASSWORD}
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
      QUARKUS_OTEL_SDK_DISABLED: "true"
    depends_on:
      platform-db:
        condition: service_healthy
      setup-bucket:
        condition: service_completed_successfully
      polaris-bootstrap:
        condition: service_completed_successfully
    ports: ["8181:8181", "8182:8182"]
    networks: [pipeline-net]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  polaris-setup:
    image: alpine/curl:8.14.1
    env_file:
      - ${SHOPVN_ENV_FILE:-.env}
    volumes: ["./polaris/setup:/polaris:ro"]
    entrypoint: ["/bin/sh", "/polaris/setup.sh"]
    depends_on:
      polaris:
        condition: service_healthy
    networks: [pipeline-net]
    restart: "no"

  trino:
    image: trinodb/trino:${TRINO_VERSION}
    env_file:
      - ${SHOPVN_ENV_FILE:-.env}
    ports: ["8080:8080"]
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
    depends_on:
      polaris-setup:
        condition: service_completed_successfully
    networks: [pipeline-net]
    mem_limit: 1024m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - airflow db migrate && (airflow users create --username admin --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname ShopVN --lastname Admin --role Admin --email admin@example.local || airflow users list) && airflow pools set spark_pool 1 "Single local Spark JVM"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8081:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 512m

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    mem_limit: 1792m

  operations-dashboard:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "-c"]
    command: ["streamlit run /opt/shopvn/monitoring/dashboard.py --server.address=0.0.0.0 --server.port=8501"]
    volumes:
      - ./monitoring:/opt/shopvn/monitoring:ro
    ports: ["8501:8501"]
    depends_on:
      trino:
        condition: service_healthy
    mem_limit: 256m

  statsd-exporter:
    image: prom/statsd-exporter:${STATSD_EXPORTER_VERSION}
    command: ["--statsd.mapping-config=/etc/statsd/mapping.yml"]
    volumes:
      - ./monitoring/statsd-mapping.yml:/etc/statsd/mapping.yml:ro
    networks: [pipeline-net]
    mem_limit: 64m

  blackbox-exporter:
    image: prom/blackbox-exporter:${BLACKBOX_EXPORTER_VERSION}
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [pipeline-net]
    mem_limit: 64m

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [pipeline-net]
    mem_limit: 256m

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    env_file:
      - ${SHOPVN_ENV_FILE:-.env}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: [pipeline-net]
    mem_limit: 384m

networks:
  pipeline-net:
    driver: bridge
  shopvn-source-net:
    external: true
    name: ${SHOPVN_SOURCE_NETWORK}

volumes:
  platform-db-data:
  minio-data:
  api-landing:
  marketplace-landing:
