connector.name=delta_lake
hive.metastore.uri=thrift://hive-metastore:9083
# Read-after-write: Spark writes a partition, then the pipeline's reconcile reads it
# through Trino immediately. Disable the metadata cache so Trino always resolves the
# current Delta snapshot instead of serving a stale file list.
delta.metadata.cache-ttl=0s
hive.s3.endpoint=http://minio:9000
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadmin
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false
