# Shared Spark defaults for Session 06.
# Every spark-submit picks these up automatically, so each job records an
# event log that the History Server (http://localhost:18080) can replay.
spark.eventLog.enabled            true
spark.eventLog.dir                file:/tmp/spark-events
spark.history.fs.logDirectory     file:/tmp/spark-events
spark.history.ui.port             18080

# Delta Lake + S3A jars (reused from session_05, mounted at /opt/jars).
# Setting them here means spark-submit no longer needs an explicit --jars flag.
spark.jars                        /opt/jars/delta-spark_2.12-3.2.0.jar,/opt/jars/delta-storage-3.2.0.jar,/opt/jars/hadoop-aws-3.3.4.jar,/opt/jars/aws-java-sdk-bundle-1.12.262.jar
