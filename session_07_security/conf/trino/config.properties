coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=https://localhost:8443

# Password authentication (see password-authenticator.properties + password.db)
# requires an encrypted channel -- the coordinator serves HTTPS on 8443 using a
# self-signed keystore generated at container startup (see docker-compose.yml).
# Plain HTTP on 8080 stays open only for the unauthenticated /v1/info liveness
# healthcheck; SQL clients must connect over HTTPS with real credentials.
http-server.authentication.type=PASSWORD
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/certs/keystore.p12
http-server.https.keystore.key=demo-keystore-password

# Required whenever any authentication type is enabled, even single-node --
# Trino uses this to authenticate its own internal coordinator/worker calls.
internal-communication.shared-secret=demo-internal-shared-secret-2026
