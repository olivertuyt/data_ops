# Session 06 — Performance & Cost Optimization lab stack.
# Reuses the Delta/S3A jars already downloaded in session_05 (mounted read-only).
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: always

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/bronze;
        mc mb --ignore-existing local/silver;
        mc mb --ignore-existing local/gold;
        echo 'Medallion buckets created: bronze, silver, gold.';
      "

  spark-master:
    image: apache/spark:3.5.0
    container_name: s06-spark-master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8080:8080"   # Spark Master UI
      - "4040:4040"   # Spark application UI (driver)
      - "7077:7077"
    volumes:
      - ./labs:/labs
      - ./homework:/homework
      - ./scripts:/scripts
      - ./demo:/demo
      - ./data:/data
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark-events:/tmp/spark-events
      - ../session_05_pyspark_lakehouse/jars:/opt/jars:ro
    restart: always

  spark-worker:
    image: apache/spark:3.5.0
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    deploy:
      replicas: 2
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"
    volumes:
      - ./labs:/labs
      - ./homework:/homework
      - ./scripts:/scripts
      - ./demo:/demo
      - ./data:/data
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark-events:/tmp/spark-events
      - ../session_05_pyspark_lakehouse/jars:/opt/jars:ro
    depends_on:
      - spark-master
    restart: always

  spark-history:
    image: apache/spark:3.5.0
    container_name: s06-spark-history
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    ports:
      - "18080:18080"   # Spark History Server UI
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark-events:/tmp/spark-events
      - ../session_05_pyspark_lakehouse/jars:/opt/jars:ro
    depends_on:
      - spark-master
    restart: always

volumes:
  minio-data:
